name: News Bot CI

# Do NOT run the long-polling bot here — it never exits and burns Actions minutes.
# Deploy the worker to Railway/Render. This workflow only smoke-checks the codebase.

on:
  workflow_dispatch:
  push:
    paths:
      - "newsbot/**"
      - "shared/**"
      - "news_bot.py"
      - "requirements.txt"
      - "tests/**"
  pull_request:
    paths:
      - "newsbot/**"
      - "shared/**"
      - "news_bot.py"
      - "requirements.txt"
      - "tests/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import smoke
        run: |
          python -c "from newsbot import config, bot, feeds, state, ai; from shared.ai_router import get_router; print('imports ok', len(config.RSS_FEEDS), 'feeds')"

      - name: Unit tests
        run: python -m pytest tests/ -q
