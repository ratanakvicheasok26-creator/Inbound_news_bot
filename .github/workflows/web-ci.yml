name: Web CI

# Lint + typecheck + build for the Next.js site (inbound-news-web/).
# Does not touch the Telegram bot or website ingest.

on:
  workflow_dispatch:
  push:
    paths:
      - "inbound-news-web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "inbound-news-web/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inbound-news-web
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: inbound-news-web/.nvmrc
          cache: npm
          cache-dependency-path: inbound-news-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
